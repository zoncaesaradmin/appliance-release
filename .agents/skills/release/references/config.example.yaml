# Appliance release skill configs — three host/role scoped files.
#
# Day-to-day e2e:
#
#   bash .agents/skills/release/scripts/run-release-from-devhost.sh \
#     --config              references/config.devhost.example.yaml \
#     --build-publish-config references/config.build-publish.example.yaml \
#     --install-config       references/config.install.example.yaml
#
# | File | Role | Top-level keys only |
# |------|------|---------------------|
# | [config.devhost.example.yaml](config.devhost.example.yaml) | Devhost orchestration: SSH targets + report | build_host, target_host, report |
# | [config.build-publish.example.yaml](config.build-publish.example.yaml) | Build host workspace + build + publish | release_workspace, release, build_flow, bundle_store |
# | [config.install.example.yaml](config.install.example.yaml) | Target install + verify | install, verification, client_verification |
#
# Each stage script reads only the role file(s) it needs (no merge).
# Cross-step contract is still shared by value agreement across roles:
#   product version (optional release.version / PRODUCT_VERSION, else default-product-version)
#   bundle_store download base (DEV_REGISTRY file API)
#
# Rules:
# - Scripts fail closed: required keys must appear in their role file.
# - Absolute remote paths only (no ~/... on build/target hosts).
# - Secrets never live in these files — only env *names* under *_env keys.
# - Packaging pack set is build_flow.appliance_packs (all|foundation|…); install.appliance_profile
#   selects what the target turns on from the published packs. verification.*.enabled must match
#   that profile (lanllm → workflows/builder/artifact/dns all false; see config.install.example.yaml).
# - Offline builds require make seed-build-deps first (every deps/* package, including
#   dns/coredns and inference/ollama). Online builds pull the same pins from upstream.
#   New packaging deps must update deps/ + offline remap; see docs/offline-build-deps.md.
# - Appliance state dir is product-fixed /var/lib/zon/state (not config).
# - Host mDNS / Wi-Fi AP enablement is day-2 Admin UI/API only.
