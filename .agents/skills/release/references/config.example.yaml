# Appliance release skill configs — three host/role scoped files.
#
# run-release-flow.sh requires all three paths:
#
#   bash .agents/skills/release/scripts/run-release-flow.sh \
#     --config              references/config.devhost.example.yaml \
#     --build-publish-config references/config.build-publish.example.yaml \
#     --install-config       references/config.install.example.yaml
#
# | File | Role | Top-level keys only |
# |------|------|---------------------|
# | [config.devhost.example.yaml](config.devhost.example.yaml) | Devhost orchestration: SSH targets + report | build_host, target_host, report |
# | [config.build-publish.example.yaml](config.build-publish.example.yaml) | Build host workspace + build + publish | release_workspace, release, build_flow, bundle_store |
# | [config.install.example.yaml](config.install.example.yaml) | Target install + verify | install, verification, client_verification |
#
# The orchestrator merges the three into one temporary JSON document (same key
# paths stage scripts already read). Keys must not overlap across files.
#
# Cross-step contract (set in build-publish, used by install after merge):
#   release.version
#   bundle_store.mode / release_path_prefix / download base
#
# Rules:
# - Scripts fail closed: required keys must appear in their role file.
# - Absolute remote paths only (no ~/... on build/target hosts).
# - Secrets never live in these files — only env *names* under *_env keys.
# - Packaging always produces the complete product super-set; install.appliance_profile
#   only selects what the target turns on.
# - Host mDNS / Wi-Fi AP enablement is day-2 Admin UI/API only.
