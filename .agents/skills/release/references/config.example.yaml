# Appliance release skill config (single file for now).
# Copy locally (e.g. ~/appliance-release.config.yaml); do not commit secrets.
#
# run-release-flow.sh takes this file as the source of truth. Scripts do not
# invent operational defaults when a key is missing — put every required
# value here (fixed lab defaults are fine; they must still be explicit).
#
# Layout:
#   1) BUILD / PUBLISH
#   2) INSTALL / VERIFY
#
# Secrets via env (not this file); config names the env vars under
# build_flow.dev_container_image_registry.registry_*_env (e.g. REGISTRY_USER / REGISTRY_TOKEN).
# Also: APPLIANCE_BUILD_SUDO_PASSWORD, APPLIANCE_TARGET_SUDO_PASSWORD,
#   APPLIANCE_FIRST_ADMIN_PASSWORD
# Absolute remote paths only (no ~/...).

# =============================================================================
# BUILD / PUBLISH
# =============================================================================

build_host:
  alias: zonsys@192.168.1.102

release_workspace:
  remote_repo_path: /home/zonsys/ws/appliance-release
  remote_export_dir: /home/zonsys/appliance-build/export
  remote_repo_source: https://github.com/zoncaesaradmin/appliance-release.git
  remote_repo_ref: main

release:
  version: 0.1.0
  publish_latest_alias: false

bundle_store:
  # static_http | appliance_files (aliases: http/http-static, fileserver)
  mode: static_http
  release_path_prefix: appliance
  base_url: http://192.168.1.105:28081
  publish_server_alias: zonsys@192.168.1.105
  publish_remote_root: /home/zonsys/releases

  # --- appliance_files (day-2 distributor) ---
  # base_url: https://artifact-dns-1.appliance.internal/api/v1/files
  # access_token: apt_….…
  # tls_insecure: true
  # cacert_path: /abs/path/to/ca.pem

build_flow:
  # Pull the development-container/dev-build image only (build tool +
  # bundled builder). Other image pulls use their own build_flow keys.
  # Login host is derived from pull_ref (first path segment).
  # Bundled target name is always registry.local/automation-dev (not configurable).
  #
  # Default: GHCR (after: make VERSION=v0.1.0 publish)
  dev_container_image_registry:
    pull_ref: ghcr.io/zoncaesaradmin/development-container/dev-build:v0.1.0
    registry_user_env: REGISTRY_USER
    registry_token_env: REGISTRY_TOKEN
    tls_insecure: false
  # LAN only — after: make VERSION=v0.1.0 publish with IMAGE_OWNER=
  # dev_container_image_registry:
  #   pull_ref: artifact-dns-1.appliance.internal/development-container/dev-build:v0.1.0
  #   registry_user_env: REGISTRY_USER
  #   registry_token_env: REGISTRY_TOKEN
  #   tls_insecure: true
  bootstrap_command: bash /home/zonsys/ws/appliance-release/scripts/ci/bootstrap-build-host.sh
  bootstrap_needs_sudo: true
  build_needs_sudo: true
  code_repo_ref: main
  ctl_repo_ref: main
  k3s_binary_source: /home/zonsys/ci/inputs/k3s
  k3s_airgap_images_source: /home/zonsys/ci/inputs/k3s-airgap-images-amd64.tar.zst
  build_command: bash scripts/ci/build-full-bundle.sh
  publish_command: make publish-release
  # Offline / pin overrides only when needed:
  # argo / zot / dns / workspace_provisioner_*
  # release_workspace.remote_release_input_path / remote_bundle_dir

# =============================================================================
# INSTALL / VERIFY
# =============================================================================

target_host:
  alias: zonsys@192.168.1.101
  state_dir: /var/lib/zon/state

install:
  appliance_name: test-device-1
  appliance_profile: storage-landns
  dns_zone: appliance.internal
  uninstall_first: true
  # Must match release.version (download/extract path on the target).
  bundle_download_dir: /tmp/appliance-0.1.0
  bootstrap_admin_username: admin
  kubernetes_namespace: control
  control_plane_deployment: api-server
  # build_catalog_path: /Users/you/build-catalog.yaml   # required for builder*
  # additional_tls_sans_csv: 192.168.1.101

verification:
  status_command: sudo zonctl status --output json
  verify_command: sudo zonctl verify --output json
  service_health_command: sudo kubectl get pods -A
  app_version_command: sudo zonctl status --output json
  failure_log_command: sudo zonctl support-bundle --output json
  smoke_test_command: 'code="$(curl -ksS -o /dev/null -w ''%{http_code}'' https://127.0.0.1/api/v1/auth/session)" && [ "$code" = "401" ]'
  smoke_test_retries: 5
  smoke_test_retry_delay_seconds: 3
  allow_ingress_warning: true
  allow_verify_schema_bug: false
  ui_home_command: 'body="$(curl -kfsS https://192.168.1.101/)" && printf "%s" "$body" | grep -Eiq "<!doctype html|<html" && printf "%s" "$body" | grep -Eiq "Zon Appliance|Sign in to continue|Appliance status|Create first administrator"'
  argo:
    enabled: false
  builder:
    enabled: false
  artifact:
    enabled: true
    readiness_command: sudo kubectl -n artifacts wait --for=condition=Available deployment/artifactserver --timeout=120s && sudo kubectl -n artifacts get pvc appliance-registry-data
  dns:
    enabled: true
    readiness_command: sudo kubectl -n dns wait --for=condition=Available deployment/dns-server --timeout=120s && dig +short @127.0.0.1 -p 53 SOA appliance.internal

client_verification:
  base_url: https://192.168.1.101
  username: admin
  builder:
    enabled: false
    expect_disabled: true
  artifact:
    enabled: true
    expect_denied_scope: false
