# Appliance release skill config (single file for now).
# Copy locally (e.g. ~/appliance-release.config.yaml); do not commit secrets.
#
# run-release-flow.sh stages:
#   1) build/publish  (build_host + build_flow + bundle_store)
#   2) install/verify (target_host + install + verification + client_verification)
#
# Scripts fail closed when a required key is missing — only list what is used.
# Secrets via env (not this file):
#   DEV_REGISTRY / DEV_IMAGE_REPO / DEV_IMAGE_NAME
#   DEV_REGISTRY_USER / DEV_REGISTRY_TOKEN / DEV_REGISTRY_TLS_VERIFY
#   (dev_image_pull and optional build_image_mirror may share these env names)
#   APPLIANCE_BUILD_SUDO_PASSWORD / APPLIANCE_TARGET_SUDO_PASSWORD
#   APPLIANCE_FIRST_ADMIN_PASSWORD
#   HOST_WIFI_AP_PSK (only when install.host_wifi_ap_enabled; named by
#     install.host_wifi_ap_psk_env)
# Absolute remote paths only (no ~/...).

# =============================================================================
# 1) BUILD / PUBLISH
# =============================================================================

build_host:
  alias: zonsys@192.168.1.152

release_workspace:
  remote_repo_path: /home/zonsys/ws/appliance-release
  remote_export_dir: /home/zonsys/appliance-build/export
  remote_repo_source: https://github.com/zoncaesaradmin/appliance-release.git
  remote_repo_ref: main

release:
  version: 0.1.0
  publish_latest_alias: false

# Signed-bundle distribution (not a container image push).
bundle_store:
  # static_http | appliance_files
  mode: static_http
  release_path_prefix: appliance
  base_url: http://192.168.1.155:28081
  publish_server_alias: zonsys@192.168.1.155
  publish_remote_root: /home/zonsys/releases
  # --- appliance_files (day-2 distributor) ---
  # Connection derives from the same DEV_REGISTRY* env vars as image pull:
  #   https://$DEV_REGISTRY$files_path
  #   bearer: $DEV_REGISTRY_TOKEN
  #   TLS: $DEV_REGISTRY_TLS_VERIFY (false → curl -k)
  # Optional env name overrides (defaults shown):
  # registry_env: DEV_REGISTRY
  # token_env: DEV_REGISTRY_TOKEN
  # tls_verify_env: DEV_REGISTRY_TLS_VERIFY
  # files_path: /api/v1/files
  # Optional overrides only: base_url, access_token, tls_insecure, cacert_path

build_flow:
  # ---------------------------------------------------------------------------
  # DevContainer image pull (build tooling container only).
  # Bundled offline name for the appliance is fixed: registry.local/dev-build
  # This server can differ from build_image_mirror below.
  # ---------------------------------------------------------------------------
  dev_image_pull:
    registry_env: DEV_REGISTRY
    image_repo_env: DEV_IMAGE_REPO
    image_name_env: DEV_IMAGE_NAME
    image_tag: latest
    username_env: DEV_REGISTRY_USER
    token_env: DEV_REGISTRY_TOKEN
    tls_verify_env: DEV_REGISTRY_TLS_VERIFY

  # ---------------------------------------------------------------------------
  # Build-time OCI pull-through mirror = local LAN appliance Artifact Server.
  # Separate section from dev_image_pull (DevContainer host can differ later).
  # Same env names as dev_image_pull are fine for now (e.g. both on 153 Zot).
  #
  # Per-image flow when enabled:
  #   1. Try LAN: <registry>/<repository_prefix>/<image>:<tag> (timeout_seconds)
  #   2. If miss / timeout / unreachable → pull from internet/upstream
  #   3. After a successful upstream fetch → push image into the LAN mirror
  #      (best-effort; push failure does not fail the build)
  # ---------------------------------------------------------------------------
  build_image_mirror:
    enabled: true
    registry_env: DEV_REGISTRY
    # Repositories under this prefix, e.g. <registry>/build-cache/<image>:<tag>
    repository_prefix: build-cache
    username_env: DEV_REGISTRY_USER
    token_env: DEV_REGISTRY_TOKEN
    tls_verify_env: DEV_REGISTRY_TLS_VERIFY
    # Seconds to wait on mirror pull before falling back to the internet
    timeout_seconds: 10

  bootstrap_command: bash /home/zonsys/ws/appliance-release/scripts/ci/bootstrap-build-host.sh
  bootstrap_needs_sudo: true
  build_needs_sudo: true
  code_repo_ref: main
  ctl_repo_ref: main
  k3s_binary_source: /home/zonsys/ci/inputs/k3s
  k3s_airgap_images_source: /home/zonsys/ci/inputs/k3s-airgap-images-amd64.tar.zst
  # Optional override for the repo-owned offline host package payload in
  # appliance-code/scripts/package/host-packages. Layout should be
  # OS/version/arch, for example
  # ubuntu/24.04/amd64/*.deb and ubuntu/22.04/amd64/*.deb.
  # host_packages_dir_source: /home/zonsys/ci/inputs/host-packages
  build_command: bash scripts/ci/build-full-bundle.sh
  publish_command: make publish-release

# =============================================================================
# 2) INSTALL / VERIFY
# =============================================================================

target_host:
  alias: zonsys@192.168.1.153
  state_dir: /var/lib/zon/state

install:
  appliance_name: artifact-dns-1
  # core | builder | storage | landns | storage-landns | builder-landns | builder-storage-landns
  appliance_profile: storage-landns
  dns_zone: appliance.internal
  host_mdns_enabled: false
  # Management WiFi AP (optional). Default off.
  # When true, name the orchestrator env holding the WPA2 PSK (value never in yaml).
  # install-on-target resolves that env and forwards it to target zonctl as HOST_WIFI_AP_PSK.
  host_wifi_ap_enabled: false
  host_wifi_ap_psk_env: HOST_WIFI_AP_PSK
  uninstall_first: true
  # Keep in sync with release.version
  bundle_download_dir: /tmp/appliance-0.1.0
  bootstrap_admin_username: admin
  kubernetes_namespace: control
  control_plane_deployment: api-server
  # build_catalog_path: /Users/you/build-catalog.yaml   # required for builder*
  # When host_mdns_enabled=true, zonctl adds the target host's current
  # hostname.local name as an mDNS-friendly TLS SAN.
  # TLS SANs always include 10.42.0.1 for the management WiFi AP URL.
  # additional_tls_sans_csv: 192.168.1.101,artifact-dns-1.appliance.internal
  # Optional lab pulls (K3s registries.yaml); omit for preload-only:
  # image_pull_registry:
  #   registry_env: DEV_REGISTRY
  #   username_env: DEV_REGISTRY_USER
  #   token_env: DEV_REGISTRY_TOKEN
  #   tls_verify_env: DEV_REGISTRY_TLS_VERIFY

verification:
  status_command: sudo zonctl status --output json
  verify_command: sudo zonctl verify --output json
  service_health_command: sudo kubectl get pods -A
  app_version_command: sudo zonctl status --output json
  failure_log_command: sudo zonctl support-bundle --output json
  smoke_test_command: 'code="$(curl -ksS -o /dev/null -w ''%{http_code}'' https://127.0.0.1/api/v1/auth/session)" && [ "$code" = "401" ]'
  smoke_test_retries: 5
  smoke_test_retry_delay_seconds: 3
  allow_ingress_warning: true
  allow_verify_schema_bug: false
  ui_home_command: 'body="$(curl -kfsS https://artifact-dns-1.appliance.internal/)" && printf "%s" "$body" | grep -Eiq "<!doctype html|<html" && printf "%s" "$body" | grep -Eiq "Appliance Control Plane UI|appliance-controlplane-ui|Zon Appliance|Sign in to continue|Appliance status|Create first administrator"'
  argo:
    enabled: false
  builder:
    enabled: false
  artifact:
    enabled: true
    readiness_command: sudo kubectl -n artifacts wait --for=condition=Available deployment/artifactserver --timeout=120s && sudo kubectl -n artifacts get pvc appliance-registry-data
  dns:
    enabled: true
    readiness_command: sudo kubectl -n dns wait --for=condition=Available deployment/dns-server --timeout=120s && dig +short @127.0.0.1 -p 53 SOA appliance.internal

client_verification:
  # Prefer a name that matches the certificate, for example the derived
  # appliance.internal name or the target host's current hostname.local name.
  base_url: https://artifact-dns-1.appliance.internal
  username: admin
  builder:
    enabled: false
    expect_disabled: true
  artifact:
    enabled: true
    expect_denied_scope: false
