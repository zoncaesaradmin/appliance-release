# Appliance release skill config (single file for now).
# Copy locally (e.g. ~/appliance-release.config.yaml); do not commit secrets.
#
# Layout:
#   1) BUILD / PUBLISH  — build host, workspace, bundle contents, distribution
#   2) INSTALL / VERIFY — target host, appliance identity, post-install checks
#
# A later change may split these into two files; keep the grouping so that is easy.
# Absolute remote paths only (no ~/...). Secrets via env, not this file:
#   REGISTRY_TOKEN, APPLIANCE_BUILD_SUDO_PASSWORD,
#   APPLIANCE_TARGET_SUDO_PASSWORD, APPLIANCE_FIRST_ADMIN_PASSWORD

# =============================================================================
# BUILD / PUBLISH
# =============================================================================

build_host:
  alias: zonsys@192.168.1.102

release_workspace:
  # Skill-managed checkout on the build host (clone or hard-reset to remote_repo_ref).
  remote_repo_path: /home/zonsys/ws/appliance-release
  remote_export_dir: /home/zonsys/appliance-build/export
  # Defaults: origin of the local appliance-release checkout, and ref "main".
  # remote_repo_source: https://github.com/zoncaesaradmin/appliance-release.git
  # remote_repo_ref: main

release:
  version: 0.1.0
  # publish_latest_alias: true   # also publish <prefix>/latest/ (default false)

bundle_store:
  # How the signed bundle is published and how targets download it.
  #   static_http     — SCP to a plain HTTP(S) box (default)
  #   appliance_files — POST/GET authenticated /api/v1/files on a distributor
  # Aliases: http/http-static → static_http, fileserver → appliance_files.
  mode: static_http
  release_path_prefix: appliance
  base_url: http://192.168.1.105:28081

  # static_http publish target (injected as PUBLISH_SERVER / PUBLISH_REMOTE_ROOT)
  publish_server_alias: zonsys@192.168.1.105
  publish_remote_root: /home/zonsys/releases

  # --- appliance_files (day-2 distributor) ---
  # Distributor FQDN in base_url must NOT equal install.appliance_name on the
  # target (zonctl seeds /etc/hosts for the target FQDN and would shadow DNS).
  # mode: appliance_files
  # base_url: https://artifact-dns-1.appliance.internal/api/v1/files
  # access_token: apt_….…   # Dashboard → API tokens; keep this file local
  # tls_insecure: true      # default when omitted (lab self-signed)
  # cacert_path: /abs/path/to/distributor-ca.pem

build_flow:
  # One-time / GHCR login on the build host (optional if already bootstrapped).
  registry_user: your-registry-username
  # registry_token_env: REGISTRY_TOKEN   # default
  # bootstrap_command: bash /home/zonsys/ws/appliance-release/scripts/ci/bootstrap-build-host.sh
  # bootstrap_needs_sudo: true

  build_needs_sudo: true
  # Required for the default build command (build-full-bundle.sh).
  k3s_binary_source: /home/zonsys/ci/inputs/k3s
  k3s_airgap_images_source: /home/zonsys/ci/inputs/k3s-airgap-images-amd64.tar.zst
  # Defaults when omitted:
  #   build_command: bash scripts/ci/build-full-bundle.sh
  #   publish_command: make publish-release
  # (skill injects PRODUCT_VERSION, EXPORT_DIR, PUBLISH_*, K3S_*)

  # Complete v1 bundles need automation-dev for builder-capable installs.
  extra_oci_image_pull_refs: ghcr.io/zoncaesaradmin/development-container/automation-dev:v0.1.0
  extra_oci_image_refs: registry.local/automation-dev

  # --- advanced / offline overrides (omit for online builds) ---
  # code_repo_ref / ctl_repo_ref
  # argo: { enabled, version, crds_dir_source, controller_image_ref, ... }
  # zot: { version, image_pull_ref, image_archive_source }   # defaults in build-full-bundle.sh
  # dns: { version, image_pull_ref, image_archive_source }
  # workspace_provisioner_image_ref / workspace_provisioner_image_archive_source
  # extra_oci_image_archive_sources: /home/zonsys/ci/inputs/automation-dev.oci.tar
  # remote fallbacks if build-log path parsing fails:
  # (set under release_workspace) remote_release_input_path / remote_bundle_dir

# =============================================================================
# INSTALL / VERIFY
# =============================================================================

target_host:
  alias: zonsys@192.168.1.101
  # state_dir: /var/lib/zon/state   # rare override; must match zonctl --state-dir

install:
  # Required. Must be unique on the LAN and distinct from the distributor FQDN
  # in bundle_store.base_url when mode=appliance_files.
  appliance_name: storage-landns-1
  # core | storage | builder | landns | storage-landns | builder-landns | builder-storage-landns
  appliance_profile: storage-landns
  # dns_zone: appliance.internal   # default
  # Required for builder* profiles:
  # build_catalog_path: /Users/you/build-catalog.yaml
  # additional_tls_sans_csv: 192.168.1.101
  uninstall_first: true
  # bootstrap_admin_username: admin
  # kubernetes_namespace: control
  # control_plane_deployment: api-server

verification:
  # Most checks default from appliance_profile. Override only when needed.
  # smoke_test_command: 'code="$(curl -ksS -o /dev/null -w ''%{http_code}'' https://127.0.0.1/api/v1/auth/session)" && [ "$code" = "401" ]'
  allow_ingress_warning: true
  # allow_verify_schema_bug: true
  # Custom command overrides (defaults exist for status/verify/kubectl/support-bundle/argo):
  # status_command / verify_command / service_health_command / failure_log_command
  # argo: { enabled, namespaces_command, crds_command, controller_command }
  # builder: { enabled, api_command }
  # artifact: { enabled, readiness_command }
  # dns: { enabled, readiness_command, absence_command }

client_verification:
  # Required for macOS-side verify-client-access.sh. Prefer the target URL/IP.
  base_url: https://192.168.1.101
  username: admin
  # builder: { enabled, expect_disabled, workflow: { enabled, workspace_name, ... } }
  # artifact: { enabled, expect_denied_scope, oci_smoke_command, ... }
