# Build + publish config (run-release-from-devhost.sh --build-publish-config).
#
# All keys needed to produce and place the signed offline super-set bundle.
# Does not contain Mac SSH target identity or install.module selection.
#
# Cross-step contract for install (must match values the target will download):
#   product version (release.version optional override, else configs/default-product-version)
#   bundle_store download base (LAN Artifact Server files API)
#
# Example (full flow from Mac):
#   bash .agents/skills/release/scripts/run-release-from-devhost.sh \
#     --config ~/lab-devhost.yaml \
#     --build-publish-config ~/lab-build-publish.yaml \
#     --install-config ~/lab-install.yaml
#
# Rules:
# - Only top-level keys: release_workspace, release, build_flow, bundle_store.
# - Absolute paths on the build host only (no ~/...).
# - Secrets never live here — only env *names* under *_env keys.
# - Path layout under remote_build_root is skill-fixed (see below).
#
# Build-host modes (exactly one — no mix):
#   mode: online  — all third-party inputs from the public internet / GHCR
#   mode: offline — all third-party inputs from the LAN Artifact Server
#                   (after make seed-build-deps)
#
# Env families (only two — do not invent OFFLINE_*):
#   ONLINE_*  — public/GHCR tooling when mode=online
#   DEV_*     — LAN Artifact Server (offline tooling, publish, install, seed)
#
# Unification (skill does this once, then packaging is identical):
#   1) Read online_image_pull OR offline_image_pull based on mode
#   2) Map that set into DEV_* for bootstrap + build-full-bundle
#      (offline already is DEV_*; online copies ONLINE_* → DEV_*)
#   3) Remap bundle_store (also DEV_*) into DEV_* for publish-release
#
# Offline seed coverage (make seed-build-deps → every deps/* package), including:
#   development-container, git-runtime-container, workflows, artifact-server-bases,
#   dns (coredns), inference (ollama), blob-storage (minio), service-build-bases,
#   host-packages, platform-inputs (k3s/helm), message-broker.
# New packaging deps must add deps/<name> + offline lan_cache_ref/files remap;
# see docs/offline-build-deps.md and AGENTS.md "Packaging Code Reuse".
#
# Special: development-container / dev-build is also used for local appliance-code
# service builds (make dev-shell, control-plane / UI images). seed-build-deps only
# updates LAN — after changing that package, also publish manually to GHCR
# (see deps/development-container/PACKAGE.md and AGENTS.md "Shared dev-build").
#
# Runtime secrets (export on the Mac for full flow, or on the build host):
#   Always (LAN via DEV_* / bundle_store):
#     DEV_REGISTRY, DEV_REGISTRY_USER, DEV_REGISTRY_TOKEN, DEV_REGISTRY_TLS_VERIFY
#     DEV_IMAGE_REPO, DEV_IMAGE_NAME, DEV_IMAGE_TAG   # offline tooling path
#   Online mode also:
#     ONLINE_REGISTRY, ONLINE_IMAGE_REPO, ONLINE_IMAGE_NAME, ONLINE_IMAGE_TAG,
#     ONLINE_REGISTRY_USER, ONLINE_REGISTRY_TOKEN, ONLINE_REGISTRY_TLS_VERIFY
#   Plus APPLIANCE_BUILD_SUDO_PASSWORD.
#   Pack selection is a config literal (not an env):
#     build_flow.appliance_packs: all|foundation|foundation,developer|foundation,inference
#     (omit or all → full three packs)

# ============================================================================
# Release workspace on the build host
# ============================================================================

release_workspace:
  # Single build-host root. Skill-managed layout under this path:
  #   release/ — appliance-release git checkout (clone/reset each run)
  #   export/ — bundle export output ($RELEASE_WORK_ROOT/export)
  #   inputs/ — local staging for scripts/fetch-k3s-inputs.sh
  remote_build_root: /home/zonsys/appliance-build
  remote_repo_source: https://github.com/zoncaesaradmin/appliance-release.git
  remote_repo_ref: main

# ============================================================================
# Version + publish alias
# ============================================================================

release:
  # Optional. Overrides configs/default-product-version for this workflow.
  # PRODUCT_VERSION in the shell also overrides (takes precedence over this key).
  # version: 0.1.0
  publish_latest_alias: false

# ============================================================================
# Build (then publish command on the same host)
# ============================================================================

build_flow:
  # Flip this only: online | offline. Keep both pull sections below;
  # the inactive one is ignored. Skill unifies the active block → DEV_*.
  mode: online

  # Pack selection (literal, like mode). Omit or all → foundation+developer+inference+video.
  # Skill exports this as APPLIANCE_PACKS into build-full-bundle.sh.
  # Pack id is foundation (not base) — capability base is separate.
  # Match packs to the install profile, for example:
  #   appliance_packs: all
  #   appliance_packs: foundation
  #   appliance_packs: foundation,developer
  #   appliance_packs: foundation,inference          # lanllm
  #   appliance_packs: foundation,developer,inference # builder-lanllm
  #   appliance_packs: foundation,video               # training
  appliance_packs: foundation

  # Used when mode: online (ONLINE_* env vars) — all seven required
  online_image_pull:
    registry_env: ONLINE_REGISTRY
    image_repo_env: ONLINE_IMAGE_REPO
    image_name_env: ONLINE_IMAGE_NAME
    image_tag_env: ONLINE_IMAGE_TAG
    username_env: ONLINE_REGISTRY_USER
    token_env: ONLINE_REGISTRY_TOKEN
    tls_verify_env: ONLINE_REGISTRY_TLS_VERIFY

  # Used when mode: offline — same seven roles, LAN DEV_* (no separate OFFLINE_*)
  offline_image_pull:
    registry_env: DEV_REGISTRY
    image_repo_env: DEV_IMAGE_REPO
    image_name_env: DEV_IMAGE_NAME
    image_tag_env: DEV_IMAGE_TAG
    username_env: DEV_REGISTRY_USER
    token_env: DEV_REGISTRY_TOKEN
    tls_verify_env: DEV_REGISTRY_TLS_VERIFY

# ============================================================================
# Distribution (publish destination + install download source)
# ============================================================================

bundle_store:
  # Always the LAN Artifact Server files API (same DEV_* as offline tooling):
  #   https://$DEV_REGISTRY/api/v1/files/appliance/<version>/
  registry_env: DEV_REGISTRY
  username_env: DEV_REGISTRY_USER
  token_env: DEV_REGISTRY_TOKEN
  tls_verify_env: DEV_REGISTRY_TLS_VERIFY
