# Example builder-profile build catalog in the current appliance-native schema.
#
# This example is intentionally modeled from the multi-repo Forgeline-style
# catalog at /Users/zoncaesar/build-catalog.yaml, but translated into the
# appliance-native schema expected by the control-plane catalog API.
#
# Important differences from the older Forgeline schema:
# - `workProfiles` replaces top-level `profiles`
# - each workspace profile explicitly lists its repos
# - each repo has one canonical `url` plus optional `defaultRef`
# - build targets are authored under `repos[].buildTargets` (preferred).
#   The control plane flattens them to a top-level list when the catalog is
#   uploaded via PUT /api/v1/builder/catalog.
#   Top-level `buildTargets` with an explicit `repo` field remain accepted.
# - A target whose `name` equals the parent repo name is the whole-repo entry
#   and maps to one explicit execution + args list. There is no ForgeLine
#   expand-all / build_components semantics.
# - execution is `make` or `script`; mode-specific input is `args` (v1: one entry).
#   Legacy `make_target`/`repo_script` + `makeTarget`/`scriptPath` are still
#   accepted and normalized at load time.
# - Optional `workingDirectory` is a repo-relative subdirectory the workflow
#   cds into before running make/script (for example services/controlplane).
#   Omit it or leave it empty for repo root. Do not set ".".
# - script args must be repo-relative paths that exist in that checkout
#   (for example `scripts/build.sh`, not a bare `build.sh` at repo root).
#   When workingDirectory is set, script/containerfile paths are relative to
#   that subdirectory after the workflow cds there.
# - repo URLs must use HTTPS
# - `defaultRef` is only for workspace prepare/sync (branch names are fine).
#   Current-workspace builds do not clone and do not use defaultRef; they build
#   whatever is already on disk under
#   /data/zon/workspaces/<workspace-name>/<repo-name>/
#
# Builder image:
# Optional per-target builderImageDigest. Prefer the short bundle name
# (default when omitted):
#   builderImageDigest: dev-build
# Install resolves that to the digest-pinned dev-build image packaged in
# the signed bundle. Advanced overrides may use a digest-pinned reference that
# is present in the bundle. Do not paste GHCR tags.
#
# Before using this file in a real install:
# - replace repo URLs and defaultRef values with real product values
# - replace imageRepository prefixes with the operator's artifact layout
# - keep make/script args aligned with each repo's real Makefile/scripts
#
# Do not put private keys, tokens, or passwords in this file.
workProfiles:
  - name: appliance-dev
    description: Appliance platform development multi-repo workspace profile.
    repos:
      - name: appliance-code
        enabledByDefault: true
      - name: appliance-ctl
        enabledByDefault: true
      - name: appliance-release
        enabledByDefault: true

  - name: appliance-dep-dev
    description: Appliance dependencies development multi-repo workspace profile.
    repos:
      - name: development-container
        enabledByDefault: true

  - name: platform-dev
    description: Platform development multi-repo workspace profile.
    repos:
      - name: platformkit
        enabledByDefault: true
      - name: zonbundle
        enabledByDefault: true
      - name: zoncore
      - name: forgeline
        enabledByDefault: true
      - name: forgeline-release
        enabledByDefault: true

  - name: telemetry-dev
    description: Telemetry development workspace profile.
    repos:
      - name: platformkit
        enabledByDefault: true

  - name: simulation-dev
    description: Simulation development workspace profile.
    repos:
      - name: platformkit
        enabledByDefault: true
      - name: forgeline
        enabledByDefault: true

repos:
  - name: appliance-code
    url: https://github.com/zoncaesaradmin/appliance-code.git
    defaultRef: main
    buildTargets:
      - name: controlplane
        description: Build the control-plane service image (make image in services/controlplane).
        execution: make
        workingDirectory: services/controlplane
        args: [image]
        imageRepository: appliance-images/appliance-control-plane
        builderImageDigest: dev-build

  - name: appliance-ctl
    url: https://github.com/zoncaesaradmin/appliance-ctl.git
    defaultRef: main
    buildTargets:
      - name: appliance-ctl
        description: Build the zonctl binary (make build).
        execution: make
        args: [build]
        imageRepository: appliance-images/appliance-ctl
        builderImageDigest: dev-build

  - name: appliance-release
    url: https://github.com/zoncaesaradmin/appliance-release.git
    defaultRef: main
    # Workspace/sync only for now; release assembly is host-driven, not a
    # single in-tree make build target for appliance workflows.

  - name: development-container
    url: https://github.com/zoncaesaradmin/development-container.git
    defaultRef: main
    buildTargets:
      - name: development-container
        description: Build the local dev-build image (make build-dev).
        execution: make
        args: [build-dev]
        imageRepository: appliance-images/development-container
        builderImageDigest: dev-build

  - name: platformkit
    url: https://github.com/zoncaesaradmin/platformkit.git
    defaultRef: main
    buildTargets:
      # platformkit is a shared Go module; `make build` compile-checks ./...
      - name: platformkit
        description: Compile-check the platformkit Go module (make build).
        execution: make
        args: [build]
        imageRepository: users/example/platformkit
        builderImageDigest: dev-build
      - name: platformkit-test
        description: Run platformkit unit tests (make test).
        execution: make
        args: [test]
        imageRepository: users/example/platformkit-test
        builderImageDigest: dev-build

  - name: zonbundle
    url: https://github.com/zoncaesaradmin/zonbundle.git
    defaultRef: main
    buildTargets:
      - name: zonbundle
        aliases: [bundle]
        description: Build the zonbundle artifact via make.
        execution: make
        args: [build]
        imageRepository: users/example/zonbundle
        builderImageDigest: dev-build

  - name: zoncore
    url: https://github.com/zoncaesaradmin/zoncore.git
    defaultRef: main

  - name: forgeline
    url: https://github.com/zoncaesaradmin/forgeline.git
    defaultRef: main
    buildTargets:
      # Root Makefile `build` delegates to app/Makefile and builds bin/forgeline.
      # Prefer make over a script path; scripts/build.sh is only a thin wrapper.
      - name: forgeline
        description: Build the forgeline app binary (make build).
        execution: make
        args: [build]
        imageRepository: users/example/forgeline
        builderImageDigest: dev-build
      - name: forgeline-bridge
        description: Build the forgeline bridge binary (make build-bridge).
        execution: make
        args: [build-bridge]
        imageRepository: users/example/forgeline-bridge
        builderImageDigest: dev-build

  - name: forgeline-release
    url: https://github.com/zoncaesaradmin/forgeline-release.git
    defaultRef: main
